name: Frontend CI

on:
  push:
    branches: [main]
  pull_request: 
    branches: [main]
  
permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout Code
        uses: actions/checkout@v5

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: '24.15.0'
          cache: npm
        
      - name: Install dependencies
        run: npm ci

      - name: Install dependencies
        run: npm ci

      - name: Build frontend
        run: npm run build

      - name: Build Docker image
        run: docker build -t inventory-frontend:ci .
