name: Frontend CI

on:
  push:
    branches: [main]
  pull_request: 
    branches: [main]
  
permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout Code
        uses: actions/checkout@v5

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: '24.15.0'
          cache: npm
        
      - name: Install dependencies
        run: npm ci

      - name: Validate Prisma schema
        run: npx prisma validate
        env:
          DATABASE_URL: postgresql://ci:ci@localhost:5432/inventory_ci

      - name: Build backend Docker image
        run: docker build -t inventory-backend:ci . 
